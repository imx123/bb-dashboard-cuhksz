name: Verify and build
# Manual only: pushes and pull requests do not start a run. Trigger it from the Actions tab
# or with `gh workflow run "Verify and build"` when a verification pass is actually needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare the authorization-only runtime (Electron 44 is lazy)
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      # Advisories are reported in the log but do not fail the run: an upstream advisory must not hide
      # whether the build, tests and packaged artifacts are sound. Clear them in a dedicated dependency change.
      - name: Report production dependency advisories
        run: npm audit --omit=dev
        continue-on-error: true
      - run: npm run pack:cli
      - run: npm run pack:standalone
      - run: npm run verify:standalone
      - run: npm run pack:app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lms-cli-${{ matrix.os }}
          path: |
            *.tgz
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release-cli/*.tar.gz
            release-cli/*.sha256
